<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal workspace for your agents." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lab</title>
    <script>
      try {
        const theme =
          JSON.parse(localStorage.getItem('lab:preferences'))?.theme ??
          'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
