name: Sync pstack

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Sync skills
        run: bin/sync-pstack

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain .claude/skills)" ]; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create sync-pstack
          git add .claude/skills
          git commit --message 'Sync pstack skills'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sync-pstack

          if [ -z "$(gh pr list --head sync-pstack --json number --jq '.[]')" ]; then
            gh pr create \
              --title 'Sync pstack skills' \
              --body 'Updates the vendored pstack skills from cursor/plugins.'
          fi
