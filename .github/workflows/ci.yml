name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_USER: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab" --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run --bun oxfmt --check

      - name: Lint
        run: bun run lint

      - name: Check unused code
        run: bun run knip

      - name: Check types
        run: bun run check

      - name: Build
        run: bun run build

      - name: Build Storybook
        run: bun run --filter @lab/web build-storybook

      - name: Install Playwright
        run: bunx --cwd apps/web playwright install --with-deps chromium

      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgres://lab:lab@localhost:5432/lab
