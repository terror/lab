name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run --bun prettier --check .

      - name: Check types
        run: bun run check

      - name: Build
        run: bun run build
