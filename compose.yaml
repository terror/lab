services:
  lab:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lab:${POSTGRES_PASSWORD:-lab}@postgres:5432/lab
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - lab:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_USER: lab
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d lab]
      interval: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  lab:
  postgres:
